<div class="card {{backgroundColor}}">
  <div class="card-body text-white">
    <div class="h1 text-muted text-right mb-0">
      <i [class]="icon" [class.icon]="true"></i>
    </div>
    <div class="h1 mb-0">{{caption}}</div>
    <small class="text-muted text-uppercase font-weight-bold jh-card-text">{{text}}</small>
  </div>
  <div class="card-footer px-3 py-2">
    <span *ngIf="!link" class="font-xs btn-blocks">&nbsp;</span>
    <a *ngIf="link" class="font-weight-bold font-xs btn-block text-muted d-flex align-items-center" [href]="link">{{linkText}} <i class="ms-1 cil-chevron-circle-right-alt float-right font-lg"></i></a>
  </div>
</div>
